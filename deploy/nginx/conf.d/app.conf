# Phase 0 部署模板：nginx 反向代理 + HTTPS
# 用法：
#   1. 将证书放到 /etc/nginx/ssl/app.fullchain.pem 与 /etc/nginx/ssl/app.privkey.pem
#      （用 Let's Encrypt: certbot certonly --nginx -d 你的域名）
#   2. 把本文件挂到容器/主机的 /etc/nginx/conf.d/app.conf
#   3. 反向代理到后端容器（容器名 pdf-upload-service，端口 3000）
#
# 注意：当前 docker-compose 直接把 3000 暴露到公网，生产应改为仅监听内网，
#       由本 nginx 对外提供 443，避免明文 HTTP。

server {
    listen 80;
    server_name 你的域名;  # 例如 resume.yourcompany.com

    # 强制跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name 你的域名;

    ssl_certificate     /etc/nginx/ssl/app.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/app.privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 20m;

    location / {
        proxy_pass http://pdf-upload-service:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
